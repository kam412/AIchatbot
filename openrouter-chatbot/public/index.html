<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Chatbot</h1>
      <p class="subtitle">Running on Claude</p>
    </header>

    <main class="transcript" id="transcript">
      <div class="message assistant">
        <div class="bubble">Hi — what's on your mind?</div>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea
        id="input"
        placeholder="Say something…"
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
